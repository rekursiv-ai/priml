[project]
name = "nanochat-torch29"
version = "0.1.0"
description = "Isolated Torch 2.9 Hopper runtime for NanoChat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "configgle>=1.3.7",
    "einops>=0.8.2",
    "imagesize>=1.4",
    "jaxtyping>=0.3.11",
    "ninja>=1.13.0",
    "numpy>=2.2.6",
    "packaging>=26.2",
    "psutil>=7.2.2",
    "pyarrow>=21.0.0",
    "pyturbojpeg>=1.8.2",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "setuptools>=83.0.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    "typeguard>=4.4.4",
    "typing-extensions>=4.15.0",
    "wandb==0.28.0",
    "webp>=0.4.0",
    "wheel>=0.47.0",
    "wrapt>=1.17.3",
]

[tool.uv.sources]
torch = [{index = "pytorch-cu128"}]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
