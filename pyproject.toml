[project]
name = "priml"
version = "0.1.3"
description = "Malleable ML building blocks for training experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "rekursiv.ai", email = "hello@rekursiv.ai"}]
keywords = ["ml", "pytorch", "training", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # torch
    "torch==2.11.0",
    "torchao==0.17.0",
    "torchvision==0.26.0",
    # numerics
    "numpy>=2.1",
    "scipy",
    "jaxtyping",
    "typeguard",
    # media (image decode/resize used by image.py, math/pixel.py)
    "imagesize>=1.4",
    "webp>=0.4.0",
    "pyturbojpeg>=1.8.2,<2",
    # vision loss
    "lpips",
    # experiment tracking
    "wandb>=0.22.2",
    # config
    # 1.3.6 is the floor for `apply_overrides` / `configgle.launch`, which
    # priml/launch.py imports; an earlier configgle fails the export typecheck.
    "configgle>=1.3.6",
    # containers / utils
    "tqdm",
    "wrapt",
    "typing_extensions",
]

[project.optional-dependencies]
# HuggingFace model import/export (priml.hub, qwen3/kimi_k2 loaders) and
# quantized checkpoints. Opt-in so `import priml` and the core train/model path
# stay light. Install via `pip install priml[hub]`.
hub = [
    "accelerate>=1.13.0",
    "safetensors",
    "transformers>=4.57.0",
]

[dependency-groups]
# uv sync --all-groups

debug = [
    "ipykernel",
    "ipython",
]
lint = [
    "codespell>=2.2.4",
    "pre-commit>=4.6",
    "ruff",
]
test = [
    "hypothesis>=6.155.1",
    "pytest-cov",
    "pytest-testmon>=2.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=7.0",
]
typecheck = [
    "basedpyright>=1.10",
    "ty>=0.0.60",
    # safetensors is TYPE_CHECKING-imported in hub.py; install it (py.typed) so
    # the type gate resolves it without shipping it as a core dep.
    "safetensors",
]
dev = [
    {include-group = "debug"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typecheck"},
]

[project.scripts]
priml = "priml.launch:main"

[project.urls]
Homepage = "https://www.rekursiv.ai"
Repository = "https://github.com/rekursiv-ai/priml"
Documentation = "https://github.com/rekursiv-ai/priml/tree/main/docs"
Source = "https://github.com/rekursiv-ai/priml"
Issues = "https://github.com/rekursiv-ai/priml/issues"
Changelog = "https://github.com/rekursiv-ai/priml/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["priml"]
exclude = ["**/*_test.py", "**/conftest.py"]

[tool.hatch.build.targets.sdist]
exclude = [".github/**", ".codespell-ignore"]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["*_test.py", "test_*.py"]
markers = [
    "ci_smoke: slower package/CLI smoke tests run explicitly in CI",
    "cuda: tests that require a real CUDA device (skipped in hosted CI)",
    "integration: tests that require networking or external CLIs (deselected by default)",
    "performance: timing-sensitive tests (deselected by default)",
    "slow: expensive local correctness test; excluded from the fast unit tier",
]
addopts = "-m 'not ci_smoke and not cuda and not integration and not performance' --durations=20 --dist=worksteal"
timeout = 60
filterwarnings = [
    "error",
    "ignore:Can.t initialize NVML:UserWarning",  # Optional torch runtimes may lack GPU drivers.
    "ignore:CUDA initialization. Unexpected error from cudaGetDeviceCount:UserWarning",  # GPU present but unusable under -n parallel workers; CPU-only tests probe CUDA during backward and torch warns benignly.
    "ignore::pytest.PytestUnraisableExceptionWarning",  # async subprocess cleanup after event loop closes
    "ignore:.*invalid escape sequence:SyntaxWarning",  # torchao 0.17.0 FqnToConfig docstring; mirrors root pyproject.
    "ignore:DTensor random operators may not have complete support on cpu device mesh:UserWarning",  # torch limitation on CPU test meshes; the distributed integration tests validate the materialized result (finiteness/values), not exact RNG parity.
]
norecursedirs = [
    "*.egg-info",
    ".agents",
    ".claude",
    ".hypothesis",
    ".venv",
    "__pycache__",
    "third_party",
    "typings",
]

[tool.coverage.run]
omit = [
    "*_test.py",
    "test_*.py",
    "*/tests/*",
    "*/.venv/*",
    "*/typings/*",
    "*/tools/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
show-fixes = true
line-length = 88
output-format = "concise"
target-version = "py312"
exclude = [
    ".venv/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    "**/third_party/",
]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Module-level ignores.
    "ANN",     # Flake8 annotations. (We use pyright for type checking.)
    "C90",     # McCabe complexity. (One function slightly over threshold.)
    "COM812",  # Missing trailing comma. (select=ALL warning is unfixable.)
               # https://github.com/astral-sh/ruff/issues/9216
    "CPY001",  # Missing copyright notice. (License is in LICENSE, not per-file.)

    # Relax docstring rules.
    "D100",    # Undocumented public module.
    "D101",    # Undocumented public class.
    "D102",    # Undocumented public method.
    "D103",    # Undocumented public function.
    "D104",    # Undocumented public package.
    "D105",    # Undocumented magic method.
    "D106",    # Undocumented public nested class.
    "D107",    # Undocumented public init.
    "D203",    # Incorrect blank line before class. (Conflicts with D211.)
    "D205",    # Missing blank line after summary.
    "D213",    # Multi-line summary second line. (Conflicts with D212.)
    "D400",    # Missing trailing period.
    "D401",    # Non-imperative mood.
    "D415",    # Missing terminal punctuation.
    "RUF001",  # Ambiguous unicode character string. (Intentional math usage of `α, σ, γ, ×` etc.)
    "RUF002",  # Ambiguous unicode character docstring. (Intentional math usage of `α, σ, η, ε, ≝, ½` etc.)
    "RUF003",  # Ambiguous unicode character comment. (Intentional math usage of `α, σ, η, ε, ≝, ½` etc.)

    # Standard style relaxations.
    "A002",    # Builtin argument shadowing.
    "E501",    # Line too long. (Will be fixed by formatter.)
    "EM101",   # Raw string in exception.
    "EM102",   # F-string in exception.
    "ERA001",  # Commented-out code.
    "FBT001",  # Boolean type hint positional argument.
    "FBT002",  # Boolean default value positional argument.
    "FBT003",  # Boolean positional value in call.
    "FIX002",  # Line contains TODO. (Too verbose descriptions of TODOs.)
    "FLY002",  # Consider f-string instead of join. (Join is often clearer.)
    "N806",    # Non-lowercase variable in function.
    "PLR0911", # Too many return statements. (Early returns aid clarity.)
    "PLR0912", # Too many branches.
    "PLR0913", # Too many arguments.
    "PLR0915", # Too many statements.
    "PLR2044", # Empty comment. (Helps to break-up long lists.)
    "PLW0642", # Self or cls assignment. (Reassignment of name in finalize.)
    "RET504",  # Unnecessary assign.
    "TC001",   # Typing-only first-party import. (Will be fixed by formatter.)
    "TC003",   # Typing-only standard library import. (Will be fixed by formatter.)
    "TC006",   # Runtime cast value.
    "TD003",   # Missing TODO link.
    "TRY003",  # Raise vanilla args.
    "TRY300",  # Try consider else.
    "TC002",   # Typing-only third-party import. (Export strips runtime uses, leaving type-only imports.)

    # Additional style relaxations.
    # "DJ",    # Django.
    # "EXE",   # Flake8 executable.
    # "TID",   # Flake8 tidy imports.
    "A001",    # Builtin variable shadowing.
    "DTZ006",  # Call datetime fromtimestamp.
    "EXE001",  # Shebang is present but file is not executable.
    "G004",    # Logging f-string.
    "PLR1704", # Redefined argument from local.
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "SIM108",  # If-else block instead of if-exp.
    # "B008",  # Function call in default argument.
    "FIX001",  # Line contains FIXME.
    # "ICN001",# Unconventional import alias.
    # "N801",  # Invalid class name.
    # "N802",  # Invalid function name.
    # "N803",  # Invalid argument name.
    # "N813",  # Camelcase imported as lowercase.
    # "N815",  # Mixed case variable in class scope.
    # "PGH004",# Blanket noqa.
    # "PT027", # Pytest unittest raises assertion.
    "TD001",   # Invalid TODO tag: `FIXME`
    "TD002",   # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
    "TD004",   # Missing colon in TODO
    "TD005",   # Missing issue description after `TODO`
]
exclude = [
    "**/typings/**",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",    # Unused import.
]
"{*_test.py,**/tests/test*.py}" = [
    "INP001",  # Implicit namespace package. (Tests don't need __init__.py.)
    "PLR2004", # Magic value comparison.
    "S101",    # Use of `assert` detected.
    "S301",    # Pickle usage.
    "SLF001",  # Private member access.
]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true
default-section = "third-party"
detect-same-package = true
force-single-line = false
force-sort-within-sections = false
from-first = true
lines-between-types = 1
lines-after-imports = 2
extra-standard-library = ["typing", "typing_extensions", "ty_extensions"]
known-first-party = ["priml"]
no-lines-before = ["future"]
order-by-type = true
relative-imports-order = "closest-to-furthest"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = true  # Warnings fail the check (basedpyright default; pinned explicitly).
useLibraryCodeForTypes = false
exclude = [
    "**/.venv/",
    "**/node_modules/",
    "*.egg-info/",
    "**/*.ipynb",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
    "**/typings/",
]
ignore = [
    "**/.venv/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportAny = false                          # `Any` propagation is pervasive in PyTorch.
reportExplicitAny = false                  # Explicit `Any` annotations are intentional.
reportImplicitStringConcatenation = false  # Conflicts with ruff ISC003.
reportInvalidCast = false                  # All cast() calls are intentional.
reportPrivateUsage = false                 # Redundant with ruff SLF001.
reportUnannotatedClassAttribute = false    # Class attributes don't always need annotations.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false             # scipy-stubs not installed in the export env.
reportUnusedCallResult = false             # Discarding return values is idiomatic Python.
reportUnusedImport = false                 # Redundant with ruff F401.
reportCallInDefaultInitializer = false     # Immutable constructors (e.g. NamedTuple) in defaults are safe.
reportIncompatibleMethodOverride = false   # Subclasses may rename parameters.
reportMissingSuperCall = false             # Fires on plain `object` inheritance (no-op super).
reportImportCycles = false                 # Lazy imports inside functions create benign cycles.
reportUnsafeMultipleInheritance = false    # Mixin patterns are intentional.
reportMissingModuleSource = false
reportUnnecessaryTypeIgnoreComment = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportPrivateLocalImportUsage = false

[tool.ty.src]
exclude = [
    ".venv/",
    "*.egg-info/",
    ".pytest_cache/",
    "build/",
    "dist/",
    "typings/",
    "**/third_party/",
    "**/docs/",
]

[tool.ty.environment]
python-version = "3.12"
extra-paths = [
  "typings",
]

[tool.ty.terminal]
error-on-warning = true
# output-format = "concise"   # full concise gitlab github junit

[tool.ty.rules]
all = "warn"

[[tool.ty.overrides]]
include = ["typings/**"]

[tool.ty.overrides.rules]
all = "ignore"

[[tool.ty.overrides]]
include = ["*_test.py"]

[tool.ty.overrides.rules]
invalid-key = "ignore"

[tool.codespell]
# some_variable_with_typo = "connexion"  # codespell:ignore
builtin = "clear,rare,code"
ignore-words = ".codespell-ignore"
# Pre-commit exclude handles most skips. This covers direct CLI invocations.
# Don't add new folder paths here -- add them to .pre-commit-config.yaml's
# codespell exclude regex instead. This list is only for file patterns.
skip = "htmlcov,.doctrees,*.pyc,*.ico,*.png,*.jpg,*.PNG,*.inv,*.dot,*.css,*.egg-info,uv.lock,__pycache__,.git,.venv,typings,**/third_party/"

[tool.uv]
package = true
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.pip]
compile-bytecode = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Match the monorepo: pin CUDA wheels to cu128 on Linux (Together.AI drivers
# <580), leave macOS on the default CPU build. See the root pyproject for the
# full rationale on why an explicit index pin (not torch-backend=auto) is the
# only viable option across the fleet.
torch = [{index = "pytorch-cu128", marker = "sys_platform == 'linux'"}]
torchao = [{index = "pytorch-cu128", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cu128", marker = "sys_platform == 'linux'"}]

[tool.uv.workspace]
members = []
